services:
  - type: web
    name: organization-remote-signaling
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start -w @remote/signaling-server
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: CLOUDFLARE_TURN_KEY_ID
        sync: false
      - key: CLOUDFLARE_TURN_API_TOKEN
        sync: false
      - key: TURN_CREDENTIAL_TTL
        value: "86400"
    buildFilter:
      paths:
        - apps/signaling-server/**
        - packages/protocol/**
        - package.json
        - package-lock.json
        - render.yaml
