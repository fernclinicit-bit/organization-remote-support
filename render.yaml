services:
  - type: web
    name: organization-remote-signaling
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start -w @remote/signaling-server
    healthCheckPath: /health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - apps/signaling-server/**
        - packages/protocol/**
        - package.json
        - package-lock.json
        - render.yaml
